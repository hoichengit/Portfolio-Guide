ario Agent</text><text x="626" y="263" font-size="16" fill="#182b49" font-weight="normal">Propose assumptions</text><rect x="610" y="325" width="265" height="82" rx="10" fill="#f6f8fc" stroke="#254f85" stroke-dasharray="6 5"/><text x="626" y="357" font-size="20" fill="#182b49" font-weight="bold">Excel / Python</text><text x="626" y="383" font-size="16" fill="#182b49" font-weight="normal">Calculate the model</text><rect x="315" y="325" width="265" height="82" rx="10" fill="#f6f8fc" stroke="#254f85" stroke-dasharray="6 5"/><text x="331" y="357" font-size="20" fill="#182b49" font-weight="bold">Power BI + QA</text><text x="331" y="383" font-size="16" fill="#182b49" font-weight="normal">Show + verify results</text><rect x="20" y="325" width="265" height="82" rx="10" fill="#f6f8fc" stroke="#254f85" stroke-dasharray="6 5"/><text x="36" y="357" font-size="20" fill="#182b49" font-weight="bold">Analyst review</text><text x="36" y="383" font-size="16" fill="#182b49" font-weight="normal">Challenge + decide</text><text x="289" y="135" font-size="25" fill="#254f85" font-weight="normal">→</text><text x="584" y="135" font-size="25" fill="#254f85" font-weight="normal">→</text><text x="738" y="191" font-size="25" fill="#254f85" font-weight="normal">↓</text><text x="289" y="255" font-size="25" fill="#254f85" font-weight="normal">→</text><text x="584" y="255" font-size="25" fill="#254f85" font-weight="normal">→</text><text x="738" y="312" font-size="25" fill="#254f85" font-weight="normal">↓</text><text x="584" y="375" font-size="25" fill="#254f85" font-weight="normal">←</text><text x="289" y="375" font-size="25" fill="#254f85" font-weight="normal">←</text><text x="20" y="439" font-size="15" fill="#53647c" font-weight="normal">QA also checks assumptions, model outputs and dashboard values at later stages.</text><text x="142" y="192" font-size="25" fill="#254f85">↓</text><text x="437" y="192" font-size="25" fill="#254f85">↓</text></g></svg>