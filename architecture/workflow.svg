<svg xmlns="http://www.w3.org/2000/svg" width="900" height="515" viewBox="0 0 900 515"><rect width="900" height="515" fill="white"/><g font-family="Arial,sans-serif" fill="#16385f"><text x="24" y="33" font-size="24" font-weight="bold">The quarterly workflow: evidence → assumptions → results</text><text x="24" y="61" font-size="16">Four actual agent roles. Calculations and publication controls run in code.</text><rect x="24" y="95" width="195" height="84" rx="10" fill="#edf3fb" stroke="#245b99"/><text x="38" y="127" font-size="22" font-weight="bold">Finance</text><text x="38" y="154" font-size="16">Check history</text><rect x="249" y="95" width="195" height="84" rx="10" fill="#edf3fb" stroke="#245b99"/><text x="263" y="127" font-size="22" font-weight="bold">Research</text><text x="263" y="154" font-size="16">Map dated evidence</text><rect x="474" y="95" width="195" height="84" rx="10" fill="#edf3fb" stroke="#245b99"/><text x="488" y="127" font-size="22" font-weight="bold">Scenario</text><text x="488" y="154" font-size="16">Propose cases</text><rect x="699" y="95" width="177" height="84" rx="10" fill="#edf3fb" stroke="#245b99"/><text x="713" y="127" font-size="22" font-weight="bold">QA</text><text x="713" y="154" font-size="16">Review / reject</text><rect x="474" y="245" width="195" height="84" rx="10" fill="#edf3fb" stroke="#245b99"/><text x="488" y="277" font-size="22" font-weight="bold">Freeze</text><text x="488" y="304" font-size="16">Save accepted inputs</text><rect x="249" y="245" width="195" height="84" rx="10" fill="#edf3fb" stroke="#245b99"/><text x="263" y="277" font-size="22" font-weight="bold">Excel / Python</text><text x="263" y="304" font-size="16">Calculate results</text><rect x="24" y="245" width="195" height="84" rx="10" fill="#edf3fb" stroke="#245b99"/><text x="38" y="277" font-size="22" font-weight="bold">Power BI</text><text x="38" y="304" font-size="16">Explore outcomes</text><text x="222" y="145" font-size="28">→</text><text x="447" y="145" font-size="28">→</text><text x="672" y="145" font-size="28">→</text><text x="780" y="216" font-size="28">↓</text><text x="681" y="294" font-size="28">←</text><text x="447" y="294" font-size="28">←</text><text x="222" y="294" font-size="28">←</text><path d="M786 224 V286 H710" stroke="#245b99" fill="none"/><rect x="24" y="377" width="852" height="80" rx="10" fill="#f7f4ea"/><text x="43" y="409" font-size="21" font-weight="bold">Analyst review: challenge assumptions and interpret trade-offs</text><text x="43" y="438" font-size="16">Document actual decisions; do not turn a generated conclusion into an invented sign-off.</text><text x="24" y="493" font-size="15">Annual financial-statement review is a separate evidence stream with Financial and QA reviews.</text></g></svg>
